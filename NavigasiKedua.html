<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigasi Kedua</title>
<link rel="stylesheet" href="NavigasiKedua.css">
</head>
<body style="margin:0; background:#121212;">

<ul class="sub-nav">
  <li><a href="#">Overview</a></li>
  <li><a href="#" class="active">Likes</a></li>
  <li><a href="#">Playlists</a></li>
  <li><a href="#">Albums</a></li>
  <li><a href="#">Stations</a></li>
  <li><a href="#">Following</a></li>
  <li><a href="#">History</a></li>
</ul>

<script>
  const subNavLinks = document.querySelectorAll(".sub-nav a");

  subNavLinks.forEach(link => {
    link.addEventListener("click", e => {
      e.preventDefault();
      document.querySelector(".sub-nav a.active").classList.remove("active");
      link.classList.add("active");
    });
  });
</script>

</body>
</html>
