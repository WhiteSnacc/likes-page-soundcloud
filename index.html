<!-- FILTER CONTAINER -->
<div class="filter-wrapper">
  <!-- 1. Tombol Kategori / Genre -->
  <div class="filter-categories">
    <button class="filter-btn active" data-category="all">Semua</button>
    <button class="filter-btn" data-category="pop">Pop</button>
    <button class="filter-btn" data-category="rock">Rock</button>
    <button class="filter-btn" data-category="electronic">Electronic</button>
    <button class="filter-btn" data-category="lofi">Lofi</button>
  </div>

  <!-- 2. Dropdown Urutan / Sorting -->
  <div class="filter-sort">
    <label for="sortSelect">Urutkan:</label>
    <select id="sortSelect">
      <option value="default">Paling Sesuai</option>
      <option value="title-asc">Judul (A - Z)</option>
      <option value="newest">Terbaru</option>
    </select>
  </div>
</div>
